<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!-- 旅帳 launcher icon. Full 108dp adaptive-icon layer; artwork stays inside the central safe zone. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#9ED8FF"/>
      <stop offset="0.55" stop-color="#5B9BE6"/>
      <stop offset="1" stop-color="#3561C4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B4C86"/>
      <stop offset="1" stop-color="#18305E"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14274D"/>
      <stop offset="1" stop-color="#1D3868"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#E9A43A"/>
    </linearGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9BE3B4"/>
      <stop offset="1" stop-color="#43B074"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="2.2" flood-color="#0B1A3A" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0B1A3A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="108" height="108" fill="url(#sky)"/>
  <rect width="108" height="108" fill="url(#glow)"/>
  <!-- faint clouds -->
  <g fill="#FFFFFF" opacity="0.18">
    <ellipse cx="78" cy="30" rx="11" ry="4.2"/>
    <ellipse cx="84" cy="27.5" rx="6" ry="4"/>
    <ellipse cx="24" cy="80" rx="9" ry="3.4"/>
  </g>

  <!-- artwork, scaled to sit inside the circular safe zone -->
  <g transform="translate(54 54) scale(0.84) translate(-56 -54)">
  <!-- banknote peeking out of the wallet -->
  <g transform="rotate(-16 62 40)" filter="url(#soft)">
    <rect x="45" y="29" width="34" height="20" rx="2.6" fill="url(#bill)"/>
    <rect x="47.3" y="31.3" width="29.4" height="15.4" rx="1.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="0.8"/>
    <circle cx="62" cy="39" r="5" fill="#FFFFFF" fill-opacity="0.35"/>
    <text x="62" y="42.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="8.4" fill="#2E8A57">$</text>
    <circle cx="51" cy="39" r="1.3" fill="#FFFFFF" fill-opacity="0.45"/>
    <circle cx="73" cy="39" r="1.3" fill="#FFFFFF" fill-opacity="0.45"/>
  </g>

  <!-- airplane -->
  <g filter="url(#soft)" transform="translate(23.5 22) rotate(45 12 12) scale(1.15)">
    <path fill="#FFFFFF" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
  </g>

  <!-- wallet -->
  <g filter="url(#shadow)">
    <rect x="27" y="45" width="52" height="38" rx="8" fill="url(#wallet)"/>
  </g>
  <path d="M35 45 h-0.5 a8 8 0 0 0 -7.5 8 v22 a8 8 0 0 0 7.5 8 h0.5 z" fill="url(#spine)"/>
  <!-- top lip highlight -->
  <rect x="35" y="45" width="44" height="2.2" rx="1.1" fill="#FFFFFF" fill-opacity="0.12"/>
  <!-- stitching -->
  <rect x="38" y="49" width="37" height="30" rx="5" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="0.7" stroke-dasharray="1.6 1.6"/>

  <!-- clasp strap -->
  <g filter="url(#soft)">
    <rect x="64" y="56" width="21" height="14" rx="7" fill="url(#strap)"/>
  </g>
  <rect x="66" y="57.2" width="17" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.35"/>
  <circle cx="71.5" cy="63" r="3.1" fill="#FFF1CC"/>
  <circle cx="71.5" cy="63" r="3.1" fill="none" stroke="#C98A2B" stroke-width="0.6"/>
  </g>
</svg>
