<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- 韓國賞楓:秋天黃昏、層疊山巒、南山首爾塔、飄落楓葉 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE3B3"/><stop offset="0.55" stop-color="#FFB070"/><stop offset="1" stop-color="#F0784A"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6DA"/><stop offset="0.6" stop-color="#FFE29A" stop-opacity="0.9"/><stop offset="1" stop-color="#FFD27A" stop-opacity="0"/>
    </radialGradient>
    <path id="leaf" d="M0,-14 L3,-6 L9,-9 L7,-2 L14,0 L7,3 L9,9 L2,6 L1,14 L0,8 L-1,14 L-2,6 L-9,9 L-7,3 L-14,0 L-7,-2 L-9,-9 L-3,-6 Z"/>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="560" cy="170" r="120" fill="url(#sun)"/>
  <circle cx="560" cy="170" r="42" fill="#FFF3D1"/>
  <!-- far mountains -->
  <path d="M0,260 C80,215 140,225 210,245 C290,195 360,200 430,235 C510,190 600,200 680,240 C730,220 770,225 800,235 V450 H0 Z" fill="#F29A6B" opacity="0.75"/>
  <path d="M0,300 C70,265 150,270 230,295 C320,255 400,262 470,290 C560,250 650,262 800,285 V450 H0 Z" fill="#E36E45"/>
  <!-- Namsan hill with N Seoul Tower -->
  <path d="M330,372 C400,340 450,300 510,290 C560,282 600,288 630,300 C670,315 710,335 760,352 C780,358 790,362 800,364 V450 H330 Z" fill="#B9472F"/>
  <g fill="#7A2A1F">
    <rect x="577" y="208" width="5" height="88" rx="2"/>
    <rect x="571" y="226" width="17" height="12" rx="4"/>
    <rect x="574" y="216" width="11" height="6" rx="2"/>
    <rect x="578.5" y="186" width="2" height="24"/>
    <path d="M566,300 L593,300 L586,288 L573,288 Z"/>
  </g>
  <!-- near hills -->
  <path d="M0,350 C90,320 190,325 290,350 C380,372 470,360 560,370 C650,380 730,365 800,372 V450 H0 Z" fill="#8E2F22"/>
  <!-- maple trees, foreground -->
  <g>
    <rect x="96" y="330" width="8" height="70" fill="#4A1A14"/>
    <circle cx="100" cy="318" r="40" fill="#D9452B"/><circle cx="72" cy="335" r="28" fill="#C23A24"/><circle cx="128" cy="336" r="30" fill="#E8603A"/><circle cx="100" cy="292" r="26" fill="#F07A3C"/>
    <rect x="726" y="345" width="7" height="60" fill="#4A1A14"/>
    <circle cx="730" cy="334" r="32" fill="#F0A13C"/><circle cx="708" cy="348" r="22" fill="#E8853A"/><circle cx="752" cy="350" r="24" fill="#D9682B"/>
  </g>
  <path d="M0,405 C150,390 300,395 450,402 C600,410 700,398 800,402 V450 H0 Z" fill="#5E1E17"/>
  <!-- falling leaves -->
  <g>
    <use href="#leaf" transform="translate(250 120) rotate(20) scale(1.3)" fill="#E2452B"/>
    <use href="#leaf" transform="translate(330 205) rotate(-30) scale(0.9)" fill="#F59E2C"/>
    <use href="#leaf" transform="translate(180 210) rotate(55) scale(1)" fill="#C8341F"/>
    <use href="#leaf" transform="translate(690 110) rotate(-15) scale(1.1)" fill="#F07A3C"/>
    <use href="#leaf" transform="translate(410 150) rotate(70) scale(0.7)" fill="#FFC14D"/>
    <use href="#leaf" transform="translate(470 300) rotate(10) scale(0.8)" fill="#E2452B"/>
    <use href="#leaf" transform="translate(760 250) rotate(-50) scale(0.75)" fill="#FFC14D"/>
  </g>
</svg>
